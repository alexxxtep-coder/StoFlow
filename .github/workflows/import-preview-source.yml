name: Import reviewed Sto.Flow source into Preview branch

on:
  push:
    branches:
      - preview/v0.3.1

permissions:
  contents: write

concurrency:
  group: stoflow-preview-import
  cancel-in-progress: false

jobs:
  import-source:
    if: github.event.head_commit.message != 'Import reviewed Sto.Flow 0.3.1 source'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out Preview branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true

      - name: Extract reviewed archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="STO.Flow_6.0_SaaS_0.3.1_reviewed.zip"
          test -f "$ARCHIVE"
          mkdir -p /tmp/stoflow-archive
          unzip -q "$ARCHIVE" -d /tmp/stoflow-archive
          APP_ROOT="$(find /tmp/stoflow-archive -maxdepth 4 -type f -name package.json -print -quit | xargs -r dirname)"
          test -n "$APP_ROOT"
          test -f "$APP_ROOT/package.json"
          cp -a "$APP_ROOT"/. .
          rm -f "$ARCHIVE" "STO.Flow_6.0_SaaS_0.3.1_reviewed (1).zip"

      - name: Commit application source to Preview branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Import reviewed Sto.Flow 0.3.1 source"
          git push origin "HEAD:${GITHUB_REF_NAME}"
